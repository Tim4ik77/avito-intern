name: Verify code and recorded experiments

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU dependencies
        run: python -m pip install -r requirements.txt
      - name: Check the three recorded experiments
        run: python experiments.py
      - name: Verify saved model and feature hashes
        run: python -c "from pathlib import Path; from solution import read_manifest, verify_bundle; p = Path('bundle'); verify_bundle(p, read_manifest(p))"
      - name: Check Python syntax
        run: python -m compileall -q predict.py solution.py experiments.py features.py train.py
